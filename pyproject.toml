[project]
name = "language-format-dev"
version = "0.1.0"
description = "Development workspace for the LanguageFormat Sublime Text plugin."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["LanguageFormat", "tests"]
exclude = ["SublimeClangFormat-master"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
