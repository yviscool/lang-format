[project]
name = "language-format-dev"
version = "0.1.0"
description = "Development workspace for the LanguageFormat Sublime Text plugin."
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.5,<8.4",
    "ruff>=0.13.2,<0.16",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["LanguageFormat", "tests"]
exclude = ["SublimeClangFormat-master"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
